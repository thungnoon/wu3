name: OpenWrt 25.12 x86_64

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openwrt-25.12]

# 核心关键：显式赋予 GitHub Actions 创建 Release 和写入资产的权限
permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai
  UPLOAD_RELEASE: true

jobs:
  Build_OpenWrt:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone ${{env.TZ}}
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone -b ${{env.REPO_BRANCH}} --single-branch --depth 1 ${{env.REPO_URL}} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds (DIY1)
        run: |
          chmod +x diy1.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy1.sh

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate default configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          make defconfig

      - name: Load custom configuration (DIY2)
        run: |
          chmod +x diy2.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy2.sh
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j$(($(nproc) + 1)) || make -j1 V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "COMPILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/x86/64
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: X86_64_ImmortalWrt_25.12
          name: ImmortalWrt 25.12 x86_64 稳定精简版
          body: |
            平台架构：X86-64
            源码分支：ImmortalWrt 25.12 (最新 Release Tag)
            默认网关 IP：192.168.5.1
            集成特性：Docker (Dockerman) / eBPF / 纯净官方底座
          files: ${{ env.FIRMWARE }}/*-squashfs-combined-efi.img.gz

      - name: 清理历史 Releases 与 Artifacts
        uses: ophub/delete-releases-workflows@main
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          delete_releases: true
          releases_keep_latest: 15
          delete_tags: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
