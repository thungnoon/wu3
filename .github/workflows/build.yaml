name: OpenWrt openwrt-24.10 x86_64 编译任务

on:
  workflow_dispatch:
  repository_dispatch:
    types: [openwrt-24.10]

# 核心关键：显式赋予 GitHub Actions 创建 Release 和写入资产的权限
permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai
  UPLOAD_RELEASE: true

jobs:
  Build_OpenWrt:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone ${{env.TZ}}
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆源码
        working-directory: /workdir
        run: |
          git clone -b ${{env.REPO_BRANCH}} --single-branch --depth 1 ${{env.REPO_URL}} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 加载自定义 Feeds (DIY1)
        run: |
          chmod +x diy1.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy1.sh

      - name: 更新与安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成默认配置文件
        run: |
          cd openwrt
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          make defconfig

      - name: 加载自定义配置 (DIY2)
        run: |
          chmod +x diy2.sh
          cd openwrt
          $GITHUB_WORKSPACE/diy2.sh
          make defconfig

      - name: 下载源码依赖包
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make -j$(($(nproc) + 1)) || make -j1 V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "COMPILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: 整理固件文件路径
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/x86/64
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: OpenWrt_${{ env.COMPILE_DATE }}
          name: ImmortalWrt x86_64 稳定精简版 (${{ env.COMPILE_DATE }})
          body: |
            平台架构：X86-64
            编译日期：${{ env.COMPILE_DATE }}
            源码分支：ImmortalWrt 24.10
            默认网关 IP：192.168.5.1
            集成特性：精简稳定版，支持历史版本回溯
          files: ${{ env.FIRMWARE }}/*-squashfs-combined-efi.img.gz

      - name: 保留最近几次历史 Releases
        uses: dev-drprasad/delete-older-releases@v0.2.0
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
